# Checks every PR against AGENTS.md › Traceability, so the rules hold for every commit, not only Claude's.
name: Process

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  traceability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Branch, PR title, issue link and KI-logg
        env:
          BRANCH: ${{ github.head_ref }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          fail=0
          err() { echo "::error::$1"; fail=1; }
          if [[ $BRANCH =~ ^(feat|fix)/([0-9]+\.[0-9]+)- ]]; then
            id=${BASH_REMATCH[2]}
            [[ $TITLE == "$id"* ]] || err "PR title must start with story id $id"
            grep -Eqi '(closes|fixes|resolves) #[0-9]+' <<<"$BODY" || err "PR body must link the story issue with 'Closes #<n>'"
            git diff --name-only "$BASE"...HEAD | grep -qx 'docs/ki-logg.md' || err "story PRs must add an entry to docs/ki-logg.md"
          elif [[ ! $BRANCH =~ ^(plan|docs|chore|ci)/[a-z0-9-]+$ ]]; then
            err "branch '$BRANCH' must be feat/<story-id>-<slug>, fix/<story-id>-<slug> or plan|docs|chore|ci/<slug>"
          fi
          exit $fail

      - name: Commit messages
        env:
          BRANCH: ${{ github.head_ref }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          fail=0
          for sha in $(git rev-list --no-merges "$BASE"..HEAD); do
            git log -1 --format=%B "$sha" > /tmp/msg
            .githooks/commit-msg /tmp/msg "$BRANCH" || { echo "::error::commit ${sha:0:7}"; fail=1; }
          done
          exit $fail
