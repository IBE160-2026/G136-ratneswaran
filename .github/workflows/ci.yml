name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm format:check

      - run: pnpm exec tsc --noEmit

      - run: pnpm test

      - name: Secret scan
        run: |
          curl -sSfLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz" | sha256sum -c -
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          ./gitleaks git --redact --no-banner

      - run: .githooks/test.sh

      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0

      - name: Start local Supabase
        run: supabase start

      - name: pgTAP
        run: supabase test db

      - name: Generated types are current
        run: |
          supabase gen types --local --lang typescript > "$RUNNER_TEMP/database.ts"
          diff "$RUNNER_TEMP/database.ts" src/types/database.ts || {
            echo "::error::src/types/database.ts is stale. Run 'supabase gen types --local --lang typescript > src/types/database.ts' and commit."
            exit 1
          }

      - name: Write .env.local
        run: |
          cp .env.example .env.local
          eval "$(supabase status -o env | grep '^SECRET_KEY=')"
          test -n "$SECRET_KEY" || { echo "::error::SECRET_KEY missing from supabase status"; exit 1; }
          echo "::add-mask::$SECRET_KEY"
          sed -i "s|^SUPABASE_SECRET_KEY=.*|SUPABASE_SECRET_KEY=$SECRET_KEY|" .env.local

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test:e2e

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

  deploy:
    needs: checks
    concurrency:
      group: deploy-main
      cancel-in-progress: false
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Check secrets
        id: secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "::notice::Deploy skipped: set SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD and SUPABASE_PROJECT_ID as repository secrets."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@v5

      - if: steps.secrets.outputs.ready == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: 2.120.0

      - if: steps.secrets.outputs.ready == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - if: steps.secrets.outputs.ready == 'true'
        run: supabase db push
